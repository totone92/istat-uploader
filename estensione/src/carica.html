<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Istat Uploader</title>
  <link rel="stylesheet" href="carica.css">
</head>
<body>
  <header class="testata">
    <div class="marchio">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="2" y="2" width="28" height="28" rx="8" class="logo-fondo"/>
        <path d="M10 21V11M16 21v-6M22 21v-9" class="logo-barre"/>
      </svg>
      <div>
        <div class="nome-app">Istat Uploader</div>
        <div class="sottotitolo">Movimenti ISTAT su Turismatica · Umbria</div>
      </div>
    </div>
    <div class="azioni-testata">
      <span id="pillola" class="pillola"></span>
      <button id="apri-dettagli" class="bottone fantasma piccolo" type="button">Dettagli</button>
    </div>
  </header>

  <div id="fascia" class="fascia"></div>
  <main id="app" class="contenuto" aria-live="polite"></main>

  <footer class="piede">
    <span>creato da <strong>Fortitudo</strong> con l'AI</span>
    <span id="versione"></span>
  </footer>

  <dialog id="dettagli" class="cassetto" aria-labelledby="titolo-dettagli">
    <div class="cassetto-testa">
      <h2 id="titolo-dettagli">Dettagli</h2>
      <form method="dialog"><button class="bottone fantasma piccolo" autofocus>Chiudi</button></form>
    </div>
    <div id="dettagli-corpo" class="cassetto-corpo"></div>
  </dialog>
  <dialog id="modale" class="modale" aria-labelledby="titolo-modale"></dialog>

  <input id="scegli-file" type="file" accept=".zip,application/zip" hidden>
  <script type="module" src="carica.js"></script>
</body>
</html>
