# Costruisce dist\IstatUploader.exe su una macchina Windows di GitHub.
#
# - a ogni push su main, e a mano da Actions → «Build Windows» → Run workflow:
#   l'.exe esce come ARTEFATTO scaricabile dalla pagina del giro (il file
#   stesso, non uno zip);
# - sempre, anche IstatUploaderSetup.exe: l'installer, che registra l'indirizzo con
#   cui HostLab apre l'app (installer/IstatUploader.iss);
# - a ogni tag vX.Y.Z: in più li allega a una RELEASE (link stabile, non scade),
#   insieme allo zip di prova (scripts/zip_di_prova.py: settembre 2026
#   inventato, bloccato in modalità vera).
#
# Segreti: solo i quattro ESIGNER_* della firma, nei passi che firmano. Oltre a quelli,
# il token che GitHub dà a ogni giro (github.token), con il permesso di scrivere i
# contenuti solo nel passo della release.
name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Dipendenze (versioni fissate)
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      # Una chiamata con la firma sbagliata (v1.3.0, apri_movimenti) è un
      # errore qui, prima della build.
      - name: Tipi
        run: python -m mypy

      # -X warn_default_encoding: ogni lettura/scrittura senza encoding esplicito
      # si vede (su Windows la codifica di default è cp1252, non UTF-8).
      # I test falliti diventano annotazioni del giro
      # (pytest-github-actions-annotate-failures), leggibili dall'API.
      # CHROME_OBBLIGATORIO: tests/test_chrome_vero.py apre le pagine del
      # portale in un Chrome vero (headless, solo 127.0.0.1) col JavaScript di
      # PrimeFaces. Qui Chrome c'è: se non parte è un fallimento, non un salto.
      - name: Test
        env:
          CHROME_OBBLIGATORIO: "1"
        run: python -X warn_default_encoding -m pytest -q -rf -rs --tb=short

      # In Python e non in PowerShell: legge __version__ dal testo del file e
      # stampa i due valori esatti se non combaciano (scripts/controlla_tag.py).
      - name: La versione del tag è quella dell'app
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/controlla_tag.py "${{ github.ref_name }}"

      # La firma (BUILD_WINDOWS.md, «La firma»): solo sui tag e sui giri a mano, perché ogni
      # giro consuma 8 firme del piano. Senza i quattro segreti la build esce non firmata,
      # con un avviso. La versione di CodeSignTool è fissata col suo hash.
      - name: La firma è pronta?
        shell: pwsh
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
          GIRO_DA_FIRMARE: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
        run: |
          if ($env:GIRO_DA_FIRMARE -ne "true") {
            "::notice::Giro su main: non firmato, la firma si fa sui tag e sui giri a mano."
            exit 0
          }
          if (-not ($env:ESIGNER_USERNAME -and $env:ESIGNER_PASSWORD -and $env:ESIGNER_CREDENTIAL_ID -and $env:ESIGNER_TOTP_SECRET)) {
            "::warning::Mancano i segreti ESIGNER_*: la build esce NON firmata."
            exit 0
          }
          $zip = Join-Path $env:RUNNER_TEMP "codesigntool.zip"
          $cartella = Join-Path $env:RUNNER_TEMP "codesigntool"
          Invoke-WebRequest "https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2-windows.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne "4AFC32E8B7F79BBE1DE7E4E7049AAAD4E0F754357613B9BBEC0E3052F06FD36B") { throw "CodeSignTool: hash inatteso" }
          Expand-Archive $zip $cartella
          "FIRMA_PRONTA=1" >> $env:GITHUB_ENV
          "CODESIGNTOOL_DIR=$cartella" >> $env:GITHUB_ENV

      - name: Costruisco IstatUploader.exe
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
        run: python -m PyInstaller IstatUploader.spec --noconfirm --clean

      # Prima delle autoverifiche, così queste provano l'.exe che esce davvero.
      - name: Firma dell'eseguibile
        if: env.FIRMA_PRONTA == '1'
        shell: pwsh
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
        run: scripts\firma.ps1 dist\IstatUploader.exe

      # L'.exe appena fatto controlla di avere tutto dentro (i moduli Selenium
      # caricati per nome, Selenium Manager, Tk). Non apre né Chrome né finestre.
      - name: Autoverifica dell'eseguibile
        timeout-minutes: 3
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\IstatUploader.exe `
                -ArgumentList '--autoverifica', 'dist\autoverifica.txt' -Wait -PassThru
          Get-Content dist\autoverifica.txt
          if ($p.ExitCode -ne 0) { throw "autoverifica fallita ($($p.ExitCode))" }
          $mb = [math]::Round((Get-Item dist\IstatUploader.exe).Length / 1MB, 1)
          "IstatUploader.exe: $mb MB" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      # La finestra VERA: l'.exe apre WebView2 con l'interfaccia, aspetta che il
      # JavaScript abbia parlato col Python (window.__ui_pronto) e si chiude.
      # Prima ci si assicura che WebView2 ci sia, così un fallimento qui vuol
      # dire «la finestra è rotta», non «manca un componente alla macchina».
      - name: WebView2 sulla macchina di build
        shell: pwsh
        run: |
          $c = python -c "from uploader_turismatica.finestra import webview2_presente as w; print(w())"
          "WebView2 presente: $c"
          if ($c -ne "True") {
            Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile wv2.exe
            $i = Start-Process .\wv2.exe -ArgumentList '/silent', '/install' -Wait -PassThru
            "installazione WebView2: $($i.ExitCode)"
          }

      - name: Autoverifica della finestra
        timeout-minutes: 4
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\IstatUploader.exe `
                -ArgumentList '--autoverifica-finestra', 'dist\finestra.txt' -Wait -PassThru
          Get-Content dist\finestra.txt
          Get-Content dist\finestra.txt | Add-Content $env:GITHUB_STEP_SUMMARY
          if ($p.ExitCode -ne 0) { throw "la finestra non funziona ($($p.ExitCode))" }

      # Il controllo del computer, come lo farà chi lo usa: apre e chiude Chrome
      # davvero (Chrome c'è sulle macchine di GitHub) e prova Selenium Manager.
      # Informativo: una macchina di GitHub non è il PC di un albergatore, e
      # un suo capriccio non deve fermare la build.
      - name: Controllo del computer (apre Chrome)
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\IstatUploader.exe `
                -ArgumentList '--controllo' -Wait -PassThru
          Get-Content "$env:APPDATA\UploaderTurismatica\controllo.txt"
          if ($p.ExitCode -ne 0) { throw "controllo: qualcosa con la ✗" }

      - name: Costruisco l'installer
        shell: pwsh
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
        run: |
          $v = python -c "import uploader_turismatica as u; print(u.__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE -ne 0) { throw "Inno Setup non installato" } }
          $firma = @()
          if ($env:FIRMA_PRONTA -eq "1") {
            $firma = "/DFirma", "/Sfirma=powershell -NoProfile -ExecutionPolicy Bypass -File $PWD\scripts\firma.ps1 `$f"
          }
          & $iscc "/DVersione=$v" @firma installer\IstatUploader.iss
          if ($LASTEXITCODE -ne 0) { throw "installer non costruito" }

      # Catena valida fino a una radice di Windows e marca temporale, per .exe e installer;
      # poi i binari dentro l'.exe, che Smart App Control controlla uno per uno.
      - name: Verifica della firma
        if: env.FIRMA_PRONTA == '1'
        shell: pwsh
        run: |
          $kit = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1
          foreach ($f in "dist\IstatUploader.exe", "dist\IstatUploaderSetup.exe") {
            $s = Get-AuthenticodeSignature $f
            "$f : $($s.Status), $($s.SignerCertificate.Subject), marca: $($s.TimeStamperCertificate.Subject)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
            if (-not $s.TimeStamperCertificate) { throw "$f senza marca temporale" }
            & $kit.FullName verify /pa /tw $f
            if ($LASTEXITCODE -ne 0) { throw "$f : firma non valida" }
          }
          python scripts/firma_pe.py dist/IstatUploader.exe
          if ($LASTEXITCODE -ne 0) { throw "binari interni senza firma" }

      # L'installer vero, come lo userà un gestore: senza amministratore, poi si guarda che
      # l'indirizzo punti all'.exe installato e che quell'.exe funzioni.
      - name: Provo l'installer
        timeout-minutes: 5
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\IstatUploaderSetup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installazione fallita ($($p.ExitCode))" }
          $comando = (Get-ItemProperty 'HKCU:\Software\Classes\hostlab-turismatica\shell\open\command').'(default)'
          "indirizzo registrato: $comando"
          $exe = "$env:LOCALAPPDATA\Programs\IstatUploader\IstatUploader.exe"
          if ($comando -ne "`"$exe`" `"%1`"") { throw "comando inatteso" }
          $a = Start-Process -FilePath $exe -ArgumentList '--autoverifica', "$env:RUNNER_TEMP\av.txt" -Wait -PassThru
          if ($a.ExitCode -ne 0) { throw "autoverifica dell'installato fallita" }

      # Lo zip di prova si costruisce qui, dal codice, e non si committa.
      - name: Zip di prova (settembre 2026 inventato)
        run: python scripts/zip_di_prova.py dist/prova-settembre-2026.zip

      # archive: false ⇒ l'artefatto È il file (niente zip attorno), e si
      # chiama come il file.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/IstatUploader.exe
          archive: false
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@v7
        with:
          path: dist/IstatUploaderSetup.exe
          archive: false
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@v7
        with:
          path: dist/prova-settembre-2026.zip
          archive: false
          if-no-files-found: error
          retention-days: 90

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: IstatUploader.exe
          path: scaricati/exe
      - uses: actions/download-artifact@v8
        with:
          name: IstatUploaderSetup.exe
          path: scaricati/setup
      # ⚠️ skip-decompress: un artefatto che È uno zip (Content-Type
      # application/zip) download-artifact v8 lo SCOMPATTA da solo — era il
      # motivo per cui la Release di v1.1.1 non trovava prova-settembre-2026.zip
      # (nella cartella c'erano i .txt). Il nome del file scaricato viene dal
      # Content-Disposition (ripiego «artifact»): si prende quello che c'è.
      - uses: actions/download-artifact@v8
        with:
          name: prova-settembre-2026.zip
          path: scaricati/prova
          skip-decompress: true
      - name: Release con l'.exe e lo zip di prova
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -laR scaricati
          mkdir -p release
          exe=$(find scaricati/exe -type f -name '*.exe' | head -n 1)
          zip=$(find scaricati/prova -type f | head -n 1)
          test -n "$exe" || { echo "IstatUploader.exe non scaricato"; exit 1; }
          test -n "$zip" || { echo "zip di prova non scaricato"; exit 1; }
          setup=$(find scaricati/setup -type f -name '*.exe' | head -n 1)
          test -n "$setup" || { echo "IstatUploaderSetup.exe non scaricato"; exit 1; }
          cp "$exe" release/IstatUploader.exe
          cp "$setup" release/IstatUploaderSetup.exe
          cp "$zip" release/prova-settembre-2026.zip
          # dev'essere ancora uno zip, col marcatore dentro
          unzip -l release/prova-settembre-2026.zip | grep -q 'PROVA.txt' \
            || { echo "lo zip di prova non contiene PROVA.txt"; exit 1; }
          gh release create "${{ github.ref_name }}" release/IstatUploaderSetup.exe release/IstatUploader.exe release/prova-settembre-2026.zip \
            --repo "${{ github.repository }}" \
            --title "Istat Uploader ${{ github.ref_name }}" \
            --notes "IstatUploaderSetup.exe installa il programma e il collegamento col tasto di HostLab. IstatUploader.exe è il programma senza installazione, per caricare uno zip a mano. prova-settembre-2026.zip contiene file INVENTATI per la prima prova: funziona solo in MODALITÀ PROVA. Istruzioni: BUILD_WINDOWS.md."
