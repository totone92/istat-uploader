[project]
name = "uploader-turismatica"
version = "1.1.0"
description = "Carica i movimenti ISTAT giornalieri su Turismatica (Regione Umbria)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Selenium >= 4.6 porta dentro **Selenium Manager**: trova Chrome, scarica
    # il ChromeDriver giusto e lo tiene in cache. È la ragione per cui qui NON
    # c'è webdriver-manager — vedi uploader_turismatica/chrome.py.
    "selenium>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6.6"]

[project.gui-scripts]
uploader-turismatica = "uploader_turismatica.app:avvia"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["uploader_turismatica*"]

[tool.ruff]
line-length = 90
target-version = "py311"
# Lo script originale resta fuori da git e fuori dal lint (ce n'è una copia
# congelata in docs/, anche lei com'era).
extend-exclude = ["Uploader2.py", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Il pacchetto si importa dalla cartella del progetto: niente installazione
# in modalità sviluppo, né qui né nella build di Windows.
pythonpath = ["."]
